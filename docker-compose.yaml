version: "3.8"

services:
  nexus-ai-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-ai-server
    env_file:
      - .env
    expose:
      - "3005"
    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      - redis

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: nexus-ai-nginx
    ports:
      - "8080:80"
    depends_on:
      - nexus-ai-server

  redis:
    image: redis:alpine
    container_name: nexus-ai-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

volumes:
  redis_data: {}
